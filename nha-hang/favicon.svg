<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradient vàng kim cao cấp với độ tương phản cao -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B27" />
      <stop offset="35%" stop-color="#FDF0CD" />
      <stop offset="65%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B32" />
    </linearGradient>
    
    <!-- Gradient nền tối sâu lắng ấm áp để làm nổi bật màu vàng kim -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1A17" />
      <stop offset="80%" stop-color="#0F0E0C" />
      <stop offset="100%" stop-color="#070605" />
    </radialGradient>
  </defs>

  <!-- Nền hình tròn tối sang trọng -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />
  
  <!-- Vòng tròn phụ bên trong dạng nét mảnh đứt quãng tạo cảm giác di sản cổ kính -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10 8" opacity="0.5" />

  <!-- Biểu tượng chính: Hoa sen cách điệu kết hợp chữ lồng AV (Đã tối ưu hóa kích thước cho Favicon) -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Hoa sen cách điệu ở phần trên (nét rõ ràng hơn) -->
    <!-- Cánh sen chính giữa -->
    <path d="M 0,-115 C 15,-85 20,-60 0,-25 C -20,-60 -15,-85 0,-115 Z" fill="url(#goldGrad)" />
    <!-- Cánh sen trái -->
    <path d="M 0,-25 C -35,-65 -45,-85 -30,-100 C -15,-110 -10,-95 0,-25 Z" fill="url(#goldGrad)" opacity="0.85" />
    <!-- Cánh sen phải -->
    <path d="M 0,-25 C 35,-65 45,-85 30,-100 C 15,-110 10,-95 0,-25 Z" fill="url(#goldGrad)" opacity="0.85" />
    <!-- Cánh sen ôm dưới trái -->
    <path d="M 0,-25 C -55,-45 -65,-60 -50,-75 C -35,-85 -30,-75 0,-25 Z" fill="url(#goldGrad)" opacity="0.7" />
    <!-- Cánh sen ôm dưới phải -->
    <path d="M 0,-25 C 55,-45 65,-60 50,-75 C 35,-85 30,-75 0,-25 Z" fill="url(#goldGrad)" opacity="0.7" />

    <!-- Chữ lồng AV cách điệu hình học đương đại bằng nét vẽ dày, rõ ràng -->
    <!-- Chữ A nét chính -->
    <path d="M -80,90 L 0,-25 L 80,90" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Thanh ngang chữ A (nét mái đình cổ kính Việt Nam cách điệu) -->
    <path d="M -40,40 Q 0,46 40,40" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />

    <!-- Chữ V lồng từ dưới lên ôm trọn chữ A -->
    <path d="M -60,25 L 0,115 L 60,25" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Điểm nhụy tròn vàng kim ở tâm -->
    <circle cx="0" cy="-25" r="9" fill="url(#goldGrad)" />
  </g>
</svg>