<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Nền tối màu Deep Steel Navy (#0F172A) với bo góc nhẹ và viền mảnh màu cam bảo hộ (#EA580C) để nổi bật trên mọi giao diện trình duyệt -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="4" fill="#0F172A" stroke="#EA580C" stroke-width="1"/>
  
  <!-- Chữ T (Màu trắng - Tượng trưng cho kết cấu dầm bê tông cốt thép vững chãi) -->
  <!-- Thanh ngang chữ T -->
  <rect x="6" y="9" width="9" height="3" rx="0.5" fill="#FFFFFF"/>
  <!-- Thanh dọc chữ T -->
  <rect x="9" y="12" width="3" height="11" rx="0.5" fill="#FFFFFF"/>
  
  <!-- Chữ S (Màu Safety Orange #EA580C - Đại diện cho an toàn lao động và kỹ thuật Trường Sơn) -->
  <!-- Thanh ngang trên -->
  <rect x="16.5" y="9" width="9.5" height="3" rx="0.5" fill="#EA580C"/>
  <!-- Thanh dọc trên bên trái -->
  <rect x="16.5" y="12" width="3" height="3" fill="#EA580C"/>
  <!-- Thanh ngang giữa -->
  <rect x="16.5" y="14.5" width="9.5" height="3" rx="0.5" fill="#EA580C"/>
  <!-- Thanh dọc dưới bên phải -->
  <rect x="23" y="17.5" width="3" height="3" fill="#EA580C"/>
  <!-- Thanh ngang dưới -->
  <rect x="16.5" y="20" width="9.5" height="3" rx="0.5" fill="#EA580C"/>
</svg>