<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Nền xanh lá cây rừng sâu sang trọng (Deep Sage Green) -->
  <rect width="512" height="512" rx="140" fill="#1C2D27" />
  
  <!-- Biểu tượng hoa sen nghệ thuật tối giản ở trung tâm đại diện cho sự An Nhiên -->
  <g transform="translate(0, 15)">
    <!-- Cánh sen trung tâm - màu vàng hổ phách ấm áp (Tertiary #D4A373) -->
    <path d="M256,110 C215,210 225,320 256,370 C287,320 297,210 256,110 Z" fill="#D4A373" />
    
    <!-- Cánh sen trái - màu kem nhã nhặn (Neutral #FAEDCD) -->
    <path d="M256,170 C165,215 170,325 238,370 C190,315 205,250 256,170 Z" fill="#FAEDCD" opacity="0.95" />
    
    <!-- Cánh sen phải - màu kem nhã nhặn (Neutral #FAEDCD) -->
    <path d="M256,170 C347,215 342,325 274,370 C322,315 307,250 256,170 Z" fill="#FAEDCD" opacity="0.95" />
    
    <!-- Cánh sen phụ ôm ngoài cùng bên trái - màu rêu Moss (Secondary #8C9D83) -->
    <path d="M232,235 C130,265 150,355 215,372 C150,340 170,290 232,235 Z" fill="#8C9D83" opacity="0.85" />
    
    <!-- Cánh sen phụ ôm ngoài cùng bên phải - màu rêu Moss (Secondary #8C9D83) -->
    <path d="M280,235 C382,265 362,355 297,372 C362,340 342,290 280,235 Z" fill="#8C9D83" opacity="0.85" />
    
    <!-- Giọt sương / Tinh dầu thiên nhiên tinh khiết rơi trên đỉnh búp sen -->
    <circle cx="256" cy="75" r="14" fill="#D4A373" />
  </g>
</svg>